services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      API_INTERNAL_URL: http://backend:4000
      UPLOAD_API_KEY: ${UPLOAD_API_KEY:-}
      ADMIN_USERS_JSON: ${ADMIN_USERS_JSON:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-moderation}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-moderation}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_API_KEY: ${UPLOAD_API_KEY:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-moderation-private}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-moderation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MAX_IMAGE_SIDE: ${MAX_IMAGE_SIDE:-12000}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["/bin/sh", "-c", "pnpm --filter @moderation/database migrate && pnpm --filter @moderation/api start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-moderation}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-moderation}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-3}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-moderation-private}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-moderation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_NEMOTRON_MODEL: ${OPENROUTER_NEMOTRON_MODEL:-nvidia/nemotron-3.5-content-safety}
      OPENROUTER_QWEN_MODEL: ${OPENROUTER_QWEN_MODEL:-qwen/qwen3.6-flash}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      MODERATION_TEST_MODE: ${MODERATION_TEST_MODE:-false}
      RISK_ALLOW_MAX: ${RISK_ALLOW_MAX:-29}
      RISK_REVIEW_MAX: ${RISK_REVIEW_MAX:-69}
      RISK_PRIMARY_NSFW_POINTS: ${RISK_PRIMARY_NSFW_POINTS:-70}
      RISK_METADATA_SIGNAL_POINTS: ${RISK_METADATA_SIGNAL_POINTS:-30}
      RISK_PEOPLE_MISMATCH_POINTS: ${RISK_PEOPLE_MISMATCH_POINTS:-35}
      RISK_BODY_PART_MISMATCH_POINTS: ${RISK_BODY_PART_MISMATCH_POINTS:-35}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moderation}
      POSTGRES_USER: ${POSTGRES_USER:-moderation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moderation} -d ${POSTGRES_DB:-moderation}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: infra/docker/minio
    image: local/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-moderation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
